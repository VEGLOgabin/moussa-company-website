{% extends 'base.html' %}

{% block title %}Créer un compte | Sojainnovation{% endblock %}

{% block style %}
<style>


</style>
{% endblock %}



{% block content %}
<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-6">
        <h1 class="title has-text-centered">Créer un compte</h1>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="field">
            <label class="label">Prénom</label>
            <div class="control">
              <input class="input" type="text" name="first_name" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Nom</label>
            <div class="control">
              <input class="input" type="text" name="last_name" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Sexe</label>
            <div class="control">
              <div class="select">
                <select name="sex">
                  <option value="Homme">Homme</option>
                  <option value="Femme">Femme</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label">Date de naissance</label>
            <div class="control">
              <input class="input" type="date" name="birthdate">
            </div>
          </div>

          <div class="field">
            <label class="label">Téléphone</label>
            <div class="control">
              <input class="input" type="tel" name="phone_number" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Email</label>
            <div class="control">
              <input class="input" type="email" name="email" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Mot de passe</label>
            <div class="control">
              <input class="input" type="password" name="password" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Photo de profil</label>
            <div class="control">
              <input class="file-input" type="file" name="photo">
            </div>
          </div>

          <div class="field mt-5">
            <div class="control">
              <button type="submit" class="button is-primary is-fullwidth">Créer mon compte</button>
            </div>
          </div>
        </form>
        <p class="has-text-centered mt-4">
          Vous avez déjà un compte ? <a href="{% url 'login' %}">Connectez-vous</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
