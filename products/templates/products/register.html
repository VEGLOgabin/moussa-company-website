{% extends 'base.html' %}

{% block title %}Créer un compte | Sojainnovation{% endblock %}

{% block style %}
<style>
  .form-box {
    border-radius: 15px;
    background-color: #fdfcfb;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
  }

  .form-box h1.title {
    color: #4caf50;
    font-weight: 700;
  }

  .file-label .file-cta {
    background-color: #4caf50;
    color: white;
    border-radius: 6px;
  }

  .file-name {
    font-style: italic;
  }
</style>
{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-7">
        <div class="form-box">
          <h1 class="title has-text-centered">Créer un compte</h1>

          <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="field">
              <label class="label">Prénom</label>
              <div class="control">
                <input class="input" type="text" name="first_name" placeholder="Votre prénom" required>
              </div>
            </div>

            <div class="field">
              <label class="label">Nom</label>
              <div class="control">
                <input class="input" type="text" name="last_name" placeholder="Votre nom" required>
              </div>
            </div>

            <div class="field">
              <label class="label">Sexe</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select name="sex">
                    <option value="Homme">Homme</option>
                    <option value="Femme">Femme</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">Date de naissance</label>
              <div class="control">
                <input class="input" type="date" name="birthdate">
              </div>
            </div>

            <div class="field">
              <label class="label">Téléphone</label>
              <div class="control">
                <input class="input" type="tel" name="phone_number" placeholder="+229..." required>
              </div>
            </div>

            <div class="field">
              <label class="label">Email</label>
              <div class="control">
                <input class="input" type="email" name="email" placeholder="exemple@sojainnovation.bj" required>
              </div>
            </div>

            <div class="field">
              <label class="label">Mot de passe</label>
              <div class="control">
                <input class="input" type="password" name="password" required>
              </div>
            </div>

            <div class="field">
              <label class="label">Photo de profil</label>
              <div class="file has-name is-fullwidth is-boxed">
                <label class="file-label">
                  <input class="file-input" type="file" name="photo">
                  <span class="file-cta">
                    <span class="file-icon"><i class="fas fa-upload"></i></span>
                    <span class="file-label">Choisir un fichier</span>
                  </span>
                  <span class="file-name">Aucun fichier choisi</span>
                </label>
              </div>
            </div>

            <div class="field mt-5">
              <div class="control">
                <button type="submit" class="button is-success is-fullwidth">Créer mon compte</button>
              </div>
            </div>
          </form>

          <p class="has-text-centered mt-4">
            Vous avez déjà un compte ? <a href="{% url 'login' %}">Connectez-vous</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  // Show selected filename for file input
  document.addEventListener('DOMContentLoaded', function () {
    const fileInput = document.querySelector('.file-input');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        const fileName = document.querySelector('.file-name');
        if (fileInput.files.length > 0) {
          fileName.textContent = fileInput.files[0].name;
        } else {
          fileName.textContent = "Aucun fichier choisi";
        }
      });
    }
  });
</script>
{% endblock %}
